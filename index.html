<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Загрузка</title>
    <style>
        body {
            margin: 0;
            height: 100dvh;
            background: linear-gradient(135deg, #000000, #444444);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Монета */
        .button-inner {
            display: block;
            width: min(60vw, 280px);
            height: auto;
            animation: upDown 3s ease-in-out infinite;
            margin-bottom: 40px; /* Отступ до полоски */
        }

        @keyframes upDown {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-20px); }
        }

        /* Полоска загрузки */
        .loader-line {
            width: 150px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader-line::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 30%;
            background-color: snow;
            border-radius: 4px;
            animation: loading-bar 1.5s infinite ease-in-out;
        }

        @keyframes loading-bar {
            0% { left: -30%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
<img class="button-inner" src="https://www.pngarts.com/files/3/Silver-Coin-Free-PNG-Image.png" alt="Загрузка">
<div class="loader-line"></div>

<script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    setTimeout(() => {
        window.location.replace('HoraCliker.html');
    }, 2000);
</script>
</body>
</html>
